name: CI Pipeline

# Trigger conditions / 触发条件:
# 1. Push to main or develop branches / 推送至 main 或 develop 分支
# 2. Pull Request targeting main / 针对 main 分支的 PR
# 3. Nightly scheduled cron at 02:00 UTC / 每日凌晨 02:00 UTC 定时回归
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 2 * * *'

jobs:
  build-and-test:
    name: Build, Verify Contracts & Reconciliation Gate
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out source code repository / 检出源码仓库
      - name: Checkout Repository / 检出代码
        uses: actions/checkout@v4

      # Step 2: Set up Python runtime environment / 配置 Python 3.10 运行时
      - name: Set up Python 3.10 / 配置 Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      # Pin the JVM: PySpark 3.5 supports Java 8/11/17 only, and the runner image's default Java changes over time.
      # 固定 JVM 版本：PySpark 3.5 仅支持 Java 8/11/17，而 Runner 镜像的默认 Java 会随时间变化。
      - name: Set up Java 17 / 配置 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Step 3: Upgrade pip and install pinned dependencies / 升级 pip 并安装锁定依赖
      - name: Install Dependencies / 安装环境依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Step 4: Run full automated pytest test suite / 运行全量自动化测试套件
      - name: Run All Automated Pytest Suites / 运行全量 Pytest 自动化测试
        run: |
          pytest tests/ -v
