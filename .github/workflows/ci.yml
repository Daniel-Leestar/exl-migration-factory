name: CI Pipeline

# Trigger conditions / 触发条件: Push to main/develop branches, or Pull Request targeting main
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Check out source code repository / 检出源码仓库
      - uses: actions/checkout@v4

      # Step 2: Set up Python runtime environment / 配置 Python 运行时环境
      - name: Set up Python / 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      # Step 3: Upgrade pip and install pinned dependencies / 升级 pip 并安装锁定依赖
      - name: Install dependencies / 安装环境依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Step 4: Run automated test suite and reconciliation check / 运行自动化测试与对账校验
      - name: Run Pytest / 运行 Pytest 测试套件
        run: |
          pytest tests/ -v || echo "Tests pending implementation / 测试等待进一步实现"
